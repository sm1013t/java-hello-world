# SonarCloud project identity
sonar.projectKey=attorg-key_java-maven-project
sonar.organization=attorg
sonar.host.url=https://sonarcloud.io

# Analyze the Maven modules independently under one SonarCloud project
sonar.modules=server,webapp

# Keep source and test paths relative to each module's base directory
server.sonar.projectBaseDir=server
server.sonar.sources=src/main/java
server.sonar.tests=src/test/java
server.sonar.java.binaries=target/classes
server.sonar.junit.reportPaths=target/surefire-reports
server.sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

webapp.sonar.projectBaseDir=webapp
webapp.sonar.sources=src/main/java
webapp.sonar.tests=src/test/java
webapp.sonar.java.binaries=target/classes
webapp.sonar.junit.reportPaths=target/surefire-reports
webapp.sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Java source encoding
sonar.sourceEncoding=UTF-8
