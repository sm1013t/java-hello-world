# SonarCloud project identity
sonar.projectKey=attorg-key_java-maven-project
sonar.organization=attorg-key
sonar.host.url=https://sonarcloud.io

# SonarScanner CLI scans these source and test directories from the repository root.
sonar.sources=server/src/main/java,webapp/src/main/webapp
sonar.tests=server/src/test/java

# Compiled Java classes are required for Java analysis.
sonar.java.binaries=server/target/classes

# Collect reports from every Maven module.
sonar.junit.reportPaths=**/target/surefire-reports
sonar.coverage.jacoco.xmlReportPaths=**/target/site/jacoco/jacoco.xml

sonar.sourceEncoding=UTF-8
